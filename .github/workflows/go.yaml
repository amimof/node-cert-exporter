name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  staticcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Lint
        run: make lint
      - name: Go Vet
        run: make vet
      - name: Helm Lint
        run: make helm_lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Test
        run: make test
      - name: Race
        run: make race
      - name: Benchmark
        run: make benchmark
      - name: Coverage
        run: make coverage

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.26.0"

      - name: Compile
        run: make
